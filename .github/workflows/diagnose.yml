name: Diagnose catalogue sources

# Manual probe: prints what the sources actually return, then runs the real
# lookup end to end so its live results can be compared against them.
on:
  workflow_dispatch:
    inputs:
      page:
        description: 'Wikipedia page to inspect'
        default: 'List of Time Team episodes'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect the Wikipedia page
        run: node scripts/diagnose.mjs "${{ inputs.page }}"
      - name: Run the real lookup
        run: npm run catalogue -- --allow-empty
